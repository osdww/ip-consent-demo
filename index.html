<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP 기록 동의 테스트</title>
</head>
<body>
  <h2>IP 기록 동의 테스트</h2>
  <p>이 페이지는 웹사이트의 IP 기록과 개인정보 안내를
  테스트하기 위한 페이지입니다.</p>
  <p>테스트 서버에서 접속 기록이 처리될 수 있습니다.
  동의하지 않으면 진행하지 않아도 됩니다.</p>
  <button onclick="alert('동의했습니다. 테스트 페이지입니다.')">
    동의
  </button>
  <button onclick="alert('동의하지 않았습니다.')">
    동의하지 않음
  </button>
</body>
</html>
